<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">

    <link rel="stylesheet" href="css/login.css">

<body>
   <div class="container">
        <div>
            <h1>Login</h1>
        </div>
        
        
        <form action="home.html">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" placeholder="Digite seu email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" placeholder="Digite sua senha" id="senha" required>
            </div>

            <div class="helper-links forgot-password">
                <a href="#">Esqueceu a senha?</a>
            </div>
            
            <button type="submit">Entrar</button>
            
            <div class="helper-links">
                Não tem uma conta? <a href="index.html">Cadastre-se</a>
            </div>
        </form>
    </div>
</body>
</html>
