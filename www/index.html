<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
    <script src="cordova.js"></script>
    <script src="components/loader.js"></script>
    <link rel="stylesheet" href="components/loader.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
    </script>
</head>
<body>
    <div class="container">
        <div>
            <h1>Cadastro</h1>
        </div>
        
        <!-- Adicionado action para redirecionar para a home -->
        <form action="home.html">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" placeholder="Digite seu nome" id="nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" placeholder="Digite seu email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" placeholder="Digite sua senha" id="senha" required>
            </div>
            
            <div class="form-group">
                <label for="senha2">Confirmar Senha:</label>
                <input type="password" placeholder="Confirme a senha" id="senha2" required>
            </div>
            
            <button type="submit">Enviar</button>
            
            <div class="login-link">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </form>
    </div>
</body>
</html>
